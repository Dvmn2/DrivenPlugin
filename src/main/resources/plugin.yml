name: DrivenPlugin
description: Physics for entities such as submarines - mass, medium density, local and global forces and velocities.
version: '${version}'

main: net.dvmn2.drivenplugin.DrivenPlugin
api-version: '1.21'
load: POSTWORLD

authors: [ DVMN2 ]

permissions:
  driven.use:
    description: Use /driven
    default: op
  driven.reload:
    description: Use /driven reload
    default: op
  driven.admin:
    description: All administrative Driven permissions
    default: op
    children:
      driven.use: true
      driven.reload: true
