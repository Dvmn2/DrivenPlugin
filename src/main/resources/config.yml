# Настройки локализации сообщений.
# ru   — всегда русский
# en   — всегда английский
# auto — по локали клиента (для игроков), английский для консоли/командных блоков
settings:
  language: "auto"

physics:
  # Масса и плотность среды по умолчанию для новых driven-сущностей
  # (можно переопределить индивидуально командой /driven <targets> set mass|density <value>).
  default-mass: 1000.0
  default-density: 1.0

  # Раз в сколько тиков пересчитывать физику (1 = каждый тик, максимально плавно).
  tick-period: 1

  # Множитель для команды "get" (velocity/speed), результат округляется до int,
  # т.к. /execute store result требует целое число.
  # Стандартный множитель даёт скорость в блоках в секунду
  get-scale: 20.0
